<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Animal Friend 🐾</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #FFF7EC;
    --bg2: #FFE8D6;
    --card: #FFFFFF;
    --text: #4A3B47;
    --muted: #8B7B85;
    --primary: #FF9AA2;
    --primary-dark: #F4747E;
    --accent: #FFD166;
    --mint: #B5EAD7;
    --sky: #A0D8EF;
    --shadow: 0 6px 18px rgba(202, 122, 122, 0.15);
    --shadow-lg: 0 14px 32px rgba(202, 122, 122, 0.22);
  }

  body {
    font-family: 'Fredoka', 'Quicksand', system-ui, sans-serif;
    background: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 100%);
    background-attachment: fixed;
    color: var(--text);
    min-height: 100vh;
    padding: 24px 20px 60px;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(circle at 15% 25%, rgba(255, 209, 102, 0.15) 0, transparent 50px),
      radial-gradient(circle at 85% 15%, rgba(255, 154, 162, 0.18) 0, transparent 60px),
      radial-gradient(circle at 25% 85%, rgba(176, 224, 230, 0.2) 0, transparent 60px),
      radial-gradient(circle at 90% 75%, rgba(199, 206, 234, 0.18) 0, transparent 50px);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    color: var(--muted);
    background: white;
    padding: 10px 18px;
    border-radius: 999px;
    font-weight: 600;
    box-shadow: var(--shadow);
    margin-bottom: 24px;
    transition: transform 0.15s ease;
  }
  .back-link:hover { transform: translateX(-4px); color: var(--primary-dark); }

  .hero-card {
    background: var(--card);
    border-radius: 32px;
    padding: 40px 30px;
    text-align: center;
    box-shadow: var(--shadow-lg);
    margin-bottom: 28px;
    position: relative;
    overflow: hidden;
  }

  .hero-card::before, .hero-card::after {
    content: "";
    position: absolute;
    width: 180px;
    height: 180px;
    border-radius: 50%;
    z-index: 0;
  }
  .hero-card::before {
    background: rgba(255, 209, 102, 0.18);
    top: -60px;
    left: -50px;
  }
  .hero-card::after {
    background: rgba(255, 154, 162, 0.15);
    bottom: -60px;
    right: -50px;
  }

  .hero-emoji {
    font-size: 7rem;
    line-height: 1;
    position: relative;
    z-index: 1;
    display: inline-block;
    animation: bob 3s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50%      { transform: translateY(-8px) rotate(3deg); }
  }

  .hero-photo {
    position: relative;
    z-index: 1;
    width: clamp(180px, 38vw, 280px);
    height: clamp(180px, 38vw, 280px);
    margin: 0 auto;
    border-radius: 28px;
    overflow: hidden;
    box-shadow: 0 12px 28px rgba(202, 122, 122, 0.25);
    border: 6px solid white;
    background: var(--bg2);
    display: none;
  }
  .hero-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .hero-photo.shown { display: block; }
  .hero-photo.shown ~ .hero-emoji-fallback { display: none; }

  .hero-name {
    font-size: clamp(2rem, 5vw, 3rem);
    font-weight: 700;
    color: var(--primary-dark);
    margin: 10px 0 8px;
    position: relative;
    z-index: 1;
  }

  .hero-category {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--bg2);
    padding: 6px 16px;
    border-radius: 999px;
    font-weight: 600;
    color: var(--text);
    position: relative;
    z-index: 1;
  }

  .info-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 18px;
    margin-bottom: 28px;
  }

  .info-card {
    background: var(--card);
    border-radius: 22px;
    padding: 22px;
    box-shadow: var(--shadow);
    border-top: 6px solid var(--mint);
  }
  .info-card.diet { border-top-color: var(--accent); }

  .info-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
    font-weight: 700;
    font-size: 1.15rem;
  }
  .info-icon {
    font-size: 1.5rem;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--bg);
    display: grid;
    place-items: center;
  }
  .info-body { color: var(--text); line-height: 1.55; }

  .facts-card {
    background: var(--card);
    border-radius: 22px;
    padding: 26px;
    box-shadow: var(--shadow);
    border-top: 6px solid var(--primary);
    margin-bottom: 28px;
  }

  .facts-card h2 {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 1.3rem;
    margin-bottom: 18px;
  }
  .facts-card h2 .info-icon { background: #FFE5B4; }

  .facts-list {
    list-style: none;
    display: grid;
    gap: 12px;
  }
  .facts-list li {
    background: linear-gradient(135deg, #FFFBEF 0%, #FFF0F0 100%);
    padding: 14px 16px 14px 50px;
    border-radius: 16px;
    position: relative;
    line-height: 1.55;
    font-weight: 500;
  }
  .facts-list li::before {
    content: "✨";
    position: absolute;
    left: 16px;
    top: 13px;
    font-size: 1.2rem;
  }

  .video-card {
    background: var(--card);
    border-radius: 22px;
    padding: 26px;
    box-shadow: var(--shadow);
    border-top: 6px solid var(--sky);
  }
  .video-card h2 {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 1.3rem;
    margin-bottom: 16px;
  }
  .video-card h2 .info-icon { background: #DCEDFB; }

  .video-frame {
    position: relative;
    width: 100%;
    padding-bottom: 56.25%; /* 16:9 */
    border-radius: 16px;
    overflow: hidden;
    background: #000;
  }
  .video-frame iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }

  .not-found {
    text-align: center;
    padding: 60px 20px;
    background: white;
    border-radius: 24px;
    box-shadow: var(--shadow);
  }
  .not-found .big { font-size: 4rem; }

  @media (max-width: 600px) {
    .hero-emoji { font-size: 5.5rem; }
    .hero-card { padding: 30px 20px; }
  }
</style>
</head>
<body>
  <div class="container">
    <a class="back-link" href="animals.html">← Back to all animals</a>
    <div id="content"></div>
  </div>

<script src="animals-data.js"></script>
<script>
  function getParam(name) {
    const params = new URLSearchParams(window.location.search);
    return params.get(name);
  }

  function escapeHTML(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  const id = getParam('id');
  const content = document.getElementById('content');
  const animal = id ? getMergedAnimal(id) : null;

  if (!animal) {
    content.innerHTML = `
      <div class="not-found">
        <div class="big">🔍</div>
        <h2>Oh no! We couldn't find that animal.</h2>
        <p style="margin-top:8px;color:var(--muted)">Try going back and picking another friend.</p>
      </div>`;
  } else {
    const cat = getCategoryById(animal.category);
    document.title = `${animal.name} 🐾`;

    const facts = Array.isArray(animal.funFacts) ? animal.funFacts.filter(f => f && f.trim()) : [];
    const ytId = extractYouTubeId(animal.youtubeId || animal.youtubeUrl || "");

    content.innerHTML = `
      <div class="hero-card">
        <div class="hero-photo" id="heroPhoto"><img id="heroPhotoImg" alt="${escapeHTML(animal.name)}"></div>
        <div class="hero-emoji hero-emoji-fallback">${animal.emoji}</div>
        <h1 class="hero-name">${escapeHTML(animal.name)}</h1>
        <div class="hero-category">${cat ? cat.emoji : ''} ${escapeHTML(cat ? cat.name : '')}</div>
      </div>

      <div class="info-grid">
        <div class="info-card">
          <div class="info-header">
            <div class="info-icon">🏞️</div>
            <span>Habitat</span>
          </div>
          <div class="info-body">${escapeHTML(animal.habitat || '')}</div>
        </div>
        <div class="info-card diet">
          <div class="info-header">
            <div class="info-icon">🍽️</div>
            <span>Diet</span>
          </div>
          <div class="info-body">${escapeHTML(animal.diet || '')}</div>
        </div>
      </div>

      ${facts.length ? `
      <div class="facts-card">
        <h2><div class="info-icon">💡</div>Fun Facts</h2>
        <ul class="facts-list">
          ${facts.map(f => `<li>${escapeHTML(f)}</li>`).join('')}
        </ul>
      </div>` : ''}

      ${ytId ? `
      <div class="video-card">
        <h2><div class="info-icon">🎬</div>Watch & Learn</h2>
        <div class="video-frame">
          <iframe
            src="https://www.youtube.com/embed/${encodeURIComponent(ytId)}"
            title="${escapeHTML(animal.name)} video"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen></iframe>
        </div>
      </div>` : ''}
    `;

    // Try to load a photo: admin override first, then Wikipedia.
    const heroPhoto = document.getElementById('heroPhoto');
    const heroPhotoImg = document.getElementById('heroPhotoImg');
    getAnimalImage(animal).then(src => {
      if (!src) return;
      // Bigger version for the hero (Wikipedia thumbnails default to 320px wide).
      const display = upscaleWikiThumb(src, 640);
      heroPhotoImg.onload = () => heroPhoto.classList.add('shown');
      heroPhotoImg.onerror = () => { /* keep emoji visible */ };
      heroPhotoImg.src = display;
    }).catch(() => { /* keep emoji */ });
  }
</script>
</body>
</html>
